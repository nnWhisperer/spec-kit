# Maintainer-side workflow: re-bake the seven subagent-flow agent files against
# the current tip of `github/spec-kit:main` and surface drift via PR.
#
# Each run: (1) fetch `github/spec-kit:main` into a worktree at the upstream
# SHA, (2) run the generator against the worktree's templates/commands/,
# (3) detect drift against main's extensions/subagent-flow/agents/, (4) open
# a PR if drift detected.
#
# This decouples upstream drift detection from the fork's merge cadence — even
# if main has never merged upstream, the resync PRs keep the baked agents fresh
# against whatever upstream currently is.
#
# No mirror branch is pushed: the default GITHUB_TOKEN cannot push changes
# under .github/workflows/, which upstream now updates, so we read upstream
# in-runner instead of mirroring it to origin.
#
# act-compatible (constraint #1):
#   - `workflow_dispatch` is the primary trigger (works under act);
#   - `schedule` is for hands-off operation on GitHub (ignored by act);
#   - runner is `ubuntu-latest` (act's default);
#   - actions are pinned to versions act is known to support;
#   - no `pull_request_target`, no GitHub-only runners or services.
#
# Local-verification command (documented in extension README):
#   act workflow_dispatch -W .github/workflows/subagent-flow-resync.yml \
#       --container-architecture linux/amd64

name: subagent-flow agents resync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC

jobs:
  resync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream/main into a worktree
        id: upstream
        run: |
          git remote add upstream https://github.com/github/spec-kit.git
          git fetch upstream main
          upstream_sha=$(git rev-parse FETCH_HEAD)
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${upstream_sha:0:12}" >> "$GITHUB_OUTPUT"
          # Detached worktree at the upstream SHA. Path is kept as
          # ../upstream-main to match the SRC_DIR used by the next step.
          git worktree add --detach ../upstream-main "$upstream_sha"

      - name: Re-bake agents from upstream-main templates
        env:
          SRC_DIR: ../upstream-main/templates/commands
          OUT_DIR: extensions/subagent-flow/agents
        run: |
          bash extensions/subagent-flow/scripts/bash/build-claude-agents.sh

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet extensions/subagent-flow/agents/; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No drift detected; nothing to do."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "Drift detected; will open a PR."
          fi

      - name: Open resync PR
        if: steps.drift.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(subagent-flow): resync agents against upstream"
          title: "chore(subagent-flow): resync agents against upstream"
          body: |
            Automated re-bake of `extensions/subagent-flow/agents/` against
            `github/spec-kit:main`.

            Baked against upstream commit:
            https://github.com/github/spec-kit/commit/${{ steps.upstream.outputs.sha }}
            (`${{ steps.upstream.outputs.short_sha }}`)

            Review the diff to confirm the upstream changes are intended
            before merging.
          branch: chore/subagent-flow-resync
          base: main
          add-paths: |
            extensions/subagent-flow/agents/
